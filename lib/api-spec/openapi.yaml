openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: JuniDesk support ticketing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: account
  - name: tickets
  - name: dashboard
  - name: administration
  - name: storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: Get the signed-in user's JuniDesk profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets visible to the signed-in user
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/TicketStatus" }
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: integer }
        - in: query
          name: assigneeId
          schema: { type: string }
        - in: query
          name: teamId
          schema: { type: integer }
        - in: query
          name: sort
          schema:
            type: string
            enum: [recent, oldest, priority]
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ticket" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Submit a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tickets/{ticketId}:
    parameters:
      - in: path
        name: ticketId
        required: true
        schema: { type: integer }
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a ticket and its conversation
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket status, priority, category, team, or assignee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUpdate" }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{ticketId}/messages:
    parameters:
      - in: path
        name: ticketId
        required: true
        schema: { type: integer }
    post:
      operationId: createTicketMessage
      tags: [tickets]
      summary: Reply to a ticket or add an internal note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketMessageInput" }
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketMessage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tickets/{ticketId}/attachments:
    parameters:
      - in: path
        name: ticketId
        required: true
        schema: { type: integer }
    post:
      operationId: addTicketAttachment
      tags: [tickets]
      summary: Save uploaded file metadata on a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketAttachmentInput" }
      responses:
        "201":
          description: Attachment saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketAttachment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get ticket counts and response metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent ticket activity visible to the signed-in user
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      operationId: listUsers
      tags: [administration]
      summary: List users for administration
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: string }
    patch:
      operationId: updateUser
      tags: [administration]
      summary: Change a user's role, status, or team membership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportUser" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /teams:
    get:
      operationId: listTeams
      tags: [administration]
      summary: List support teams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTeam
      tags: [administration]
      summary: Create a support team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /teams/{teamId}:
    parameters:
      - in: path
        name: teamId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateTeam
      tags: [administration]
      summary: Update or deactivate a support team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamUpdate" }
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories:
    get:
      operationId: listCategories
      tags: [administration]
      summary: List ticket categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketCategory" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCategory
      tags: [administration]
      summary: Create a ticket category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCategory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /categories/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateCategory
      tags: [administration]
      summary: Update or deactivate a ticket category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCategory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /priorities:
    get:
      operationId: listPriorities
      tags: [administration]
      summary: List ticket priorities
      responses:
        "200":
          description: Priorities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketPriority" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPriority
      tags: [administration]
      summary: Create a ticket priority
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriorityInput" }
      responses:
        "201":
          description: Created priority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPriority" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /priorities/{priorityId}:
    parameters:
      - in: path
        name: priorityId
        required: true
        schema: { type: integer }
    patch:
      operationId: updatePriority
      tags: [administration]
      summary: Update or deactivate a ticket priority
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriorityUpdate" }
      responses:
        "200":
          description: Updated priority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPriority" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a signed file upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrl" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    TicketStatus:
      type: string
      enum: [New, Open, Pending, Resolved, Closed]
    UserRole:
      type: string
      enum: [requester, agent, admin]
    TicketMessageVisibility:
      type: string
      enum: [public, internal]
    SupportUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        teamIds:
          type: array
          items: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, email, name, role, teamIds, active, createdAt]
    UserUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        teamIds:
          type: array
          items: { type: integer }
        active: { type: boolean }
    Team:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        agentIds:
          type: array
          items: { type: string }
        active: { type: boolean }
      required: [id, name, description, agentIds, active]
    TeamInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        agentIds:
          type: array
          items: { type: string }
      required: [name]
    TeamUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        agentIds:
          type: array
          items: { type: string }
        active: { type: boolean }
    TicketCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        teamId: { type: ["integer", "null"] }
        active: { type: boolean }
      required: [id, name, teamId, active]
    CategoryInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        teamId: { type: ["integer", "null"] }
      required: [name]
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        teamId: { type: ["integer", "null"] }
        active: { type: boolean }
    TicketPriority:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        rank: { type: integer }
        active: { type: boolean }
      required: [id, name, rank, active]
    PriorityInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        rank: { type: integer, minimum: 1 }
      required: [name, rank]
    PriorityUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        rank: { type: integer, minimum: 1 }
        active: { type: boolean }
    Ticket:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string }
        subject: { type: string }
        description: { type: string }
        requesterId: { type: string }
        requesterName: { type: string }
        requesterEmail: { type: string }
        categoryId: { type: integer }
        category: { type: string }
        priority: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        assigneeId: { type: ["string", "null"] }
        assigneeName: { type: ["string", "null"] }
        teamId: { type: ["integer", "null"] }
        teamName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        messageCount: { type: integer }
      required:
        - id
        - reference
        - subject
        - description
        - requesterId
        - requesterName
        - requesterEmail
        - categoryId
        - category
        - priority
        - status
        - assigneeId
        - assigneeName
        - teamId
        - teamName
        - createdAt
        - updatedAt
        - lastActivityAt
        - messageCount
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/TicketMessage" }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/TicketAttachment" }
          required: [messages, attachments]
    TicketInput:
      type: object
      properties:
        subject: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, minLength: 5, maxLength: 10000 }
        categoryId: { type: integer }
        priority: { type: string }
      required: [subject, description, categoryId, priority]
    TicketUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { type: string }
        categoryId: { type: integer }
        teamId: { type: ["integer", "null"] }
        assigneeId: { type: ["string", "null"] }
    TicketMessage:
      type: object
      properties:
        id: { type: integer }
        ticketId: { type: integer }
        authorId: { type: string }
        authorName: { type: string }
        body: { type: string }
        visibility: { $ref: "#/components/schemas/TicketMessageVisibility" }
        createdAt: { type: string, format: date-time }
      required: [id, ticketId, authorId, authorName, body, visibility, createdAt]
    TicketMessageInput:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        visibility: { $ref: "#/components/schemas/TicketMessageVisibility" }
      required: [body, visibility]
    TicketAttachment:
      type: object
      properties:
        id: { type: integer }
        ticketId: { type: integer }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer }
        url: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, ticketId, name, contentType, size, url, createdAt]
    TicketAttachmentInput:
      type: object
      properties:
        objectPath: { type: string }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
      required: [objectPath, name, contentType, size]
    DashboardSummary:
      type: object
      properties:
        total: { type: integer }
        byStatus:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        byPriority:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        unassigned: { type: integer }
        dueToday: { type: integer }
        averageResolutionHours: { type: number }
      required: [total, byStatus, byPriority, unassigned, dueToday, averageResolutionHours]
    CountByLabel:
      type: object
      properties:
        label: { type: string }
        count: { type: integer }
      required: [label, count]
    ActivityItem:
      type: object
      properties:
        id: { type: integer }
        ticketId: { type: integer }
        ticketReference: { type: string }
        ticketSubject: { type: string }
        actorName: { type: string }
        action: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, ticketId, ticketReference, ticketSubject, actorName, action, createdAt]
    UploadRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string }
      required: [name, size, contentType]
    UploadUrl:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
      required: [uploadURL, objectPath]

